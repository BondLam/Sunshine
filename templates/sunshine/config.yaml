# Sunshine 项目配置文件
# 本文件由 sunshine init 生成，请按团队实际情况修改。
# 所有值都有合理的默认值，只改需要改的部分。
# 完整字段说明见 internal/config（Go 实现）。

#-------------------------------------------------------------------------------
# 会话记录
#-------------------------------------------------------------------------------

# 自动提交日志 / 索引改动时使用的提交消息
session_commit_message: "chore: record journal"

# 单个日志文件轮换前的最大行数
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# 会话自动提交
#-------------------------------------------------------------------------------

# 会话日志与任务归档操作的自动提交行为。
# - true（默认）：add-session / task archive 后自动暂存并提交日志与任务改动。
# - false：不碰 git，只把文件（journal-*.md、任务归档移动）写到磁盘，
#   由你决定是否 git add / commit。
#
# 如果项目的 .gitignore 特意排除了 `.sunshine/`、希望会话数据只保留在
# 本地，或者希望每次提交前都手工检查暂存内容，请用 `false`。
#
# 接受：true / false / yes / no / 1 / 0 / on / off（大小写不敏感）。
#
# session_auto_commit: true

#-------------------------------------------------------------------------------
# 任务生命周期 Hook
#-------------------------------------------------------------------------------

# 任务生命周期事件发生后运行的 shell 命令。
# 每条 hook 命令都会收到 TASK_JSON_PATH 环境变量，指向当前任务的 task.json。
# hook 失败只会打印警告，不会阻塞主任务操作。
#
# hooks:
#   after_create:
#     - "echo 'Task created'"
#   after_start:
#     - "echo 'Task started'"
#   after_finish:
#     - "echo 'Task finished'"
#   after_archive:
#     - "echo 'Task archived'"

#-------------------------------------------------------------------------------
# Monorepo / 包
#-------------------------------------------------------------------------------

# 为 monorepo 项目声明包。单仓项目不需要这一节。
#
# packages:
#   frontend:
#     path: packages/frontend
#   backend:
#     path: packages/backend
#   docs:
#     path: docs-site
#     type: submodule
#   # polyrepo / meta-repo 布局（每个子目录有独立的 .git）时，
#   # 给包标记 `git: true`，运行时会把它当作独立仓库处理
#   #（例如 git 上下文展示）。
#   webapp:
#     path: ./webapp
#     git: true

# 未指定 --package 时使用的默认包。
# default_package: frontend

#-------------------------------------------------------------------------------
# Channel worker 防护
#-------------------------------------------------------------------------------
# `sunshine channel spawn` 的 worker 默认防护。防护在 spawn 时运行
#（清理已过期的空闲 worker，再执行存活 worker 预算），也在每个
# supervisor 内部运行（持续空闲超过 `idle_timeout` 的 worker 会自我终止）。
#
# 优先级：CLI flag > 环境变量（SUNSHINE_CHANNEL_WORKER_IDLE_TIMEOUT /
# SUNSHINE_CHANNEL_MAX_LIVE_WORKERS）> 本配置 > 内置默认值。
#
# `idle_timeout: 0` 表示禁用空闲清理（worker 可无限期空闲，除非被显式
# 杀掉或给了 `--timeout`）。
# `max_live_workers: 0` 表示禁用 spawn 时的预算检查。
#
# `trusted_context_dirs` 把 `--file`/`--jsonl`/`--agent` 的 containment
# 检查扩展到 worker cwd 之外——`.sunshine/tasks` 或 `.sunshine/workspace`
# 是外部目录的符号链接时用得上。列出的目录之下的真实路径都会被接受。
# `auto_trust_sunshine_symlinks: false` 表示关闭对 `.sunshine/tasks` /
# `.sunshine/workspace` 本身是顶层符号链接时的窄幅自动信任（默认开启）。
#
channel:
  worker_guard:
    idle_timeout: 5m
    max_live_workers: 6
  # trusted_context_dirs:
  #   - /work/user/sunshine_workspace
  # auto_trust_sunshine_symlinks: false

#-------------------------------------------------------------------------------
# Codex（分发行为）
#-------------------------------------------------------------------------------
# 只对 Codex 生效的开关，其他平台忽略。默认（"auto"）分发
# sunshine-implement / sunshine-check / sunshine-research 子代理。
# 这不依赖父会话的继承转录：`fork_turns` 仍由调用方控制，而 Codex
# 原生的 SubagentStart hook 在可信时注入任务上下文，不可用时子代理侧
# 的加载仍是兜底。只有想把实现与检查留在主会话里时才设为 "inline"。
# "sub-agent" 是 "auto" 的旧别名，仍可使用。显式写出的非法值会安全地
# 落到 inline 模式。
#
# "auto" 模式下，分发的子代理默认继承主会话的模型；想给 implement /
# check / research 子代理用更便宜或更快的模型，请直接改生成的
# `.codex/agents/sunshine-*.toml` 里的 `model` / `model_reasoning_effort`
#（见那些文件里的注释提示行）——这里没有对应的配置项，
# `sunshine update` 会在重新生成时保留你的修改。
#
# codex:
#   dispatch_mode: auto  # 或 "inline"；旧别名："sub-agent"

#-------------------------------------------------------------------------------
# 子代理上下文注入上限
#-------------------------------------------------------------------------------
# 限制向子代理首条提示词内联多少任务上下文（implement.jsonl /
# check.jsonl 引用的文件，加上 prd.md / design.md / implement.md）。
# 超大文件会被截断并附提示；达到总负载上限后，剩余文件降级为索引行
#（路径 + 原因 + 大小），不再内联。
#
# 全部是字节数。`0` 表示禁用对应上限。
#
# context_injection:
#   max_file_bytes: 32768        # 每个 implement.jsonl / check.jsonl 引用文件
#   max_artifact_bytes: 65536    # 每个任务产物（prd.md / design.md / implement.md）
#   max_total_bytes: 131072      # 整个注入负载；溢出后降级为索引行

#-------------------------------------------------------------------------------
# 每轮提示词注入
#-------------------------------------------------------------------------------
# 每轮 `<workflow-state>` 面包屑的逃生口。用户提示词以独立单词形式
# 包含 skip 关键词（大小写不敏感、按词边界匹配——"no-sunshinefoo"
# 不算）时，该轮跳过面包屑。只影响当轮，不影响 SessionStart 或子代理
# 上下文注入。
#
# prompt_injection:
#   skip_keyword: "no-sunshine"   # "" 表示彻底禁用该逃生口

#-------------------------------------------------------------------------------
# Sunshine 扩展（阶段 1 沿用，非上游原文所有）
#-------------------------------------------------------------------------------

# 任务默认存放目录（相对项目根目录）
tasks_dir: .sunshine/tasks

# 规范目录（团队规约、业务术语、接口契约都放这里）
spec_dir: .sunshine/spec
