<!-- 原型入口：直接用浏览器打开就能看。样式只为看清结构，不是最终视觉，定稿后按视觉稿重写。 -->
<title>（请填写产品名称）原型</title>
<style>

  header nav a { color: #cbd5e1; margin-right: 16px; text-decoration: none; }
  main { max-width: 720px; margin: 0 auto; padding: 24px; }

  h2 { font-size: 18px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; }
  button { margin-top: 16px; padding: 8px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .hint { color: #6b7280; font-size: 13px; }
  footer { text-align: center; color: #9ca3af; font-size: 13px; padding: 24px; }

  <nav><a href="index.html">首页</a><a href="示例页.html">示例页</a></nav>

    <ul>
      <li><a href="示例页.html">示例页</a>（改这里：按需求列表一页一加）</li>
