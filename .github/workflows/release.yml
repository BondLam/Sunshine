# Sunshine 发布
#
# 触发：推送 v* 形式的 tag（如 v0.1.0、v0.2.0-beta.1）。
# 流程：检出完整历史 → 安装 Go 1.27 → goreleaser 打包多平台二进制
# 并发布 GitHub Release；用户用 sunshine upgrade 自更新。
# tag 含 -beta / -rc 后缀时自动标记为预发布（prerelease）。
name: 发布

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 注意：job ID 只能用 ASCII 字母、数字、横线与下划线（且以字母或下划线开头），
  # 中文只能放在 display name（name 字段）里，否则工作流在解析时直接失败、0 个 job。
  release:
    name: 打包并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: 发布 GitHub Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
