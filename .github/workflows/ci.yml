# Sunshine 持续集成
#
# 触发：推送与拉取请求。
# 检查内容：gofmt 格式、go vet、单元测试、构建，以及 goreleaser 发布配置。
# 本地等价验证：
#   gofmt -l .        # 应无输出
#   go vet ./...
#   go test ./...
#   go build ./...
#   goreleaser build --snapshot --clean   # 需先安装 goreleaser
name: 持续集成

"on":
  push:
  pull_request:

jobs:
  检查:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: 检查代码格式
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "以下文件未按 gofmt 格式化："
            gofmt -l .
            exit 1
          fi

      - name: 运行 go vet
        run: go vet ./...

      - name: 运行单元测试
        run: go test ./...

      - name: 构建
        run: go build ./...

  发布配置检查:
    name: 发布配置检查
    runs-on: ubuntu-latest
    needs: 检查
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # 验证 .goreleaser.yaml 有效且能产出多平台二进制（快照构建，不发布）。
      - name: 验证 goreleaser 发布配置
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean
